name: Build EXE

on: [push]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter SpeechRecognition imageio-ffmpeg pydub pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --collect-all customtkinter --collect-all imageio_ffmpeg --copy-metadata imageio_ffmpeg main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleApp-exe
          path: dist/main.exe
