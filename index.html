    ======================================================== */

    function isAudioFile(file) {

      if (!file) {
        return false;
      }


      const type =
        String(file.type || "").toLowerCase();


      const name =
        String(file.name || "").toLowerCase();


      const audioExtensions = [
        ".mp3",
        ".wav",
        ".m4a",
        ".aac",
        ".ogg",
        ".oga",
        ".flac",
        ".webm",
        ".opus",
        ".weba"
      ];


      return (
        type.startsWith("audio/") ||
        audioExtensions.some(
          (extension) =>
            name.endsWith(extension)
        )
      );

    }


    function hasAudioSource() {

      return (
        typeof audio.src === "string" &&
        audio.src.trim() !== ""
      );

    }


    function getFiniteDuration() {

      const value =
        Number(audio.duration);


      if (
        Number.isFinite(value) &&
        value >= 0
      ) {

        return value;

      }


      return 0;

    }


    function clampTime(value) {

      const durationValue =
        getFiniteDuration();


      const numericValue =
        Number(value);


      if (
        !Number.isFinite(numericValue)
      ) {

        return 0;

      }


      if (durationValue <= 0) {

        return Math.max(
          0,
          numericValue
        );

      }


      return Math.max(
        0,
        Math.min(
          durationValue,
          numericValue
        )
      );

    }


    /* =======================================================
       PLAYLIST — BIR NECHTA AUDIO
    ======================================================== */

    const playlistBtn =
      document.getElementById("playlistBtn");

    const playlistBadge =
      document.getElementById("playlistBadge");

    const playlistPanel =
      document.getElementById("playlistPanel");

    const playlistList =
      document.getElementById("playlistList");

    const playlistTitle =
      document.getElementById("playlistTitle");

    const playlistAddBtn =
      document.getElementById("playlistAddBtn");

    const playlistAutoBtn =
      document.getElementById("playlistAutoBtn");

    const playlistClearBtn =
      document.getElementById("playlistClearBtn");

    const playlistCloseBtn =
      document.getElementById("playlistCloseBtn");

    // Har bir element: { file, name, key }
    let playlist = [];

    let playlistIndex = -1;

    // Audio tugagach keyingisiga avtomatik o'tish
    let autoNext = true;

    // true bo'lsa — tanlangan fayllar mavjud ro'yxatga qo'shiladi
    let appendMode = false;

    function revokeCurrentAudioURL() {

      if (audioFileURL) {

        URL.revokeObjectURL(
          audioFileURL
        );

        audioFileURL = null;

      }

    }

    function naturalCompare(a, b) {

      // "Unit 2" "Unit 10" dan oldin keladi
      return a.name.localeCompare(
        b.name,
        undefined,
        {
          numeric: true,
          sensitivity: "base"
        }
      );

    }

    function setPlaylistOpen(open) {

      playlistPanel.classList.toggle(
        "hidden",
        !open
      );

      playlistBtn.classList.toggle(
        "active",
        open
      );

      if (open) {
        renderPlaylist();
      }

    }

    function renderPlaylist() {

      playlistList.replaceChildren();

      if (!playlist.length) {

        const empty =
          document.createElement("li");

        empty.className = "playlist-empty";

        empty.textContent =
          "Ro'yxat bo'sh. «Qo'shish» orqali audio tanlang.";

        playlistList.appendChild(empty);

      }

      playlist.forEach(
        (track, i) => {

          const li =
            document.createElement("li");

          li.className =
            "playlist-item" +
            (i === playlistIndex ? " current" : "");

          li.dataset.index = String(i);

          li.title = track.name;

          const num =
            document.createElement("span");

          num.className = "playlist-num";

          if (i === playlistIndex) {

            num.innerHTML =
              '<i class="fa-solid fa-volume-high"></i>';

          } else {

            num.textContent = String(i + 1);

          }

          const name =
            document.createElement("span");

          name.className = "playlist-name";

          name.textContent = track.name;

          const remove =
            document.createElement("button");

          remove.type = "button";

          remove.className = "playlist-remove";

          remove.title = "Ro'yxatdan olib tashlash";

          remove.dataset.remove = String(i);

          remove.innerHTML =
            '<i class="fa-solid fa-xmark"></i>';

          li.append(num, name, remove);

          playlistList.appendChild(li);

        }
      );

      playlistTitle.textContent =
        playlist.length
          ? `Playlist · ${playlist.length} ta audio`
          : "Playlist";

      playlistBadge.textContent =
        String(playlist.length);

      playlistBadge.style.display =
        playlist.length > 1
          ? "block"
          : "none";

      playlistClearBtn.disabled =
        !playlist.length;

      if (!playlistPanel.classList.contains("hidden")) {

        const current =
          playlistList.querySelector(".current");

        if (current) {

          current.scrollIntoView({
            block: "nearest"
          });

        }

      }

    }

    function loadTrack(index, options = {}) {

      if (
        index < 0 ||
        index >= playlist.length
      ) {
        return;
      }

      const autoplay =
        Boolean(options.autoplay);

      const track =
        playlist[index];

      audio.pause();

      revokeCurrentAudioURL();

      clearABLoop(
        false
      );

      playlistIndex = index;

      audioFileURL =
        URL.createObjectURL(track.file);

      audio.src =
        audioFileURL;

      audio.loop = false;

      audio.load();

      // load() tezlikni 1x ga qaytaradi — tanlangan tezlikni tiklaymiz
      updateSpeed();

      progress.value = "0";

      progress.max = "0";

      currentTime.textContent =
        "0:00";

      duration.textContent =
        "0:00";

      updateLoopButton();

      updatePlayIcon();

      renderPlaylist();

      showStatus(
        playlist.length > 1
          ? `${index + 1}/${playlist.length} · ${track.name}`
          : track.name,
        2500
      );

      if (autoplay) {

        const playPromise =
          audio.play();

        if (
          playPromise &&
          typeof playPromise.catch === "function"
        ) {

          playPromise.catch(
            (error) => {

              console.error(
                "Audio play error:",
                error
              );

              updatePlayIcon();

            }
          );

        }

      }

    }

    function addAudioFiles(fileList, append) {

      const all =
        Array.from(fileList || []);

      const valid =
        all.filter(isAudioFile);

      if (!valid.length) {

        alert(
          "Iltimos, audio fayl tanlang."
        );

        return;

      }

      const incoming =
        valid.map(
          (file) => ({
            file: file,
            name: file.name,
            key: [
              file.name,
              file.size,
              file.lastModified
            ].join("|")
          })
        ).sort(naturalCompare);

      if (append && playlist.length) {

        const known =
          new Set(
            playlist.map(
              (track) => track.key
            )
          );

        const fresh =
          incoming.filter(
            (track) => !known.has(track.key)
          );

        if (!fresh.length) {

          showStatus(
            "Bu audiolar ro'yxatda bor",
            2000
          );

          return;

        }

        playlist =
          playlist.concat(fresh);

        renderPlaylist();

        showStatus(
          `${fresh.length} ta audio qo'shildi`,
          2000
        );

        return;

      }

      playlist =
        incoming;

      loadTrack(
        0,
        { autoplay: false }
      );

      // Bir nechta audio tanlansa — ro'yxatni ko'rsatamiz
      if (playlist.length > 1) {

        setPlaylistOpen(true);

      }

    }

    function removeTrack(index) {

      if (
        index < 0 ||
        index >= playlist.length
      ) {
        return;
      }

      if (index === playlistIndex) {

        const wasPlaying =
          !audio.paused;

        playlist.splice(index, 1);

        if (!playlist.length) {

          clearPlaylist(false);

          return;

        }

        loadTrack(
          Math.min(index, playlist.length - 1),
          { autoplay: wasPlaying }
        );

      } else {

        playlist.splice(index, 1);

        if (index < playlistIndex) {
          playlistIndex--;
        }

        renderPlaylist();

      }

    }

    function clearPlaylist(showMessage = true) {

      audio.pause();

      playlist = [];

      playlistIndex = -1;

      revokeCurrentAudioURL();

      audio.removeAttribute("src");

      audio.load();

      clearABLoop(
        false
      );

      progress.value = "0";

      progress.max = "0";

      currentTime.textContent =
        "0:00";

      duration.textContent =
        "0:00";

      updateLoopButton();

      updatePlayIcon();

      renderPlaylist();

      if (showMessage) {

        showStatus(
          "Playlist tozalandi"
        );

      }

    }

    /* =======================================================
       OPEN AUDIO
    ======================================================== */

    openAudioBtn.addEventListener(
      "click",
      () => {

        appendMode = false;

        audioInput.click();

      }
    );

    audioInput.addEventListener(
      "change",
      (e) => {

        const files =
          e.target.files;

        const append =
          appendMode;

        appendMode = false;

        if (
          !files ||
          !files.length
        ) {
          return;
        }

        addAudioFiles(
          files,
          append
        );

        audioInput.value = "";

      }
    );

    /* =======================================================
       PLAYLIST UI EVENTS
    ======================================================== */

    playlistBtn.addEventListener(
      "click",
      () => {

        setPlaylistOpen(
          playlistPanel.classList.contains("hidden")
        );

      }
    );

    playlistCloseBtn.addEventListener(
      "click",
      () => setPlaylistOpen(false)
    );

    playlistAddBtn.addEventListener(
      "click",
      () => {

        appendMode = true;

        audioInput.click();

      }
    );

    playlistAutoBtn.addEventListener(
      "click",
      () => {

        autoNext = !autoNext;

        playlistAutoBtn.classList.toggle(
          "on",
          autoNext
        );

        showStatus(
          autoNext
            ? "Avto-o'tish yoqildi"
            : "Avto-o'tish o'chirildi"
        );

      }
    );

    playlistClearBtn.addEventListener(
      "click",
      () => clearPlaylist(true)
    );

    playlistList.addEventListener(
      "click",
      (e) => {

        const target =
          e.target instanceof Element
            ? e.target
            : null;

        if (!target) {
          return;
        }

        const removeBtn =
          target.closest(".playlist-remove");

        if (removeBtn) {

          removeTrack(
            Number(removeBtn.dataset.remove)
          );

          return;

        }

        const item =
          target.closest(".playlist-item");

        if (!item) {
          return;
        }

        const index =
          Number(item.dataset.index);

        if (index === playlistIndex) {

          togglePlay();

        } else {

          loadTrack(
            index,
            { autoplay: true }
          );

        }

      }
    );

    // Panel tashqarisiga bosilsa — yopiladi
    document.addEventListener(
      "pointerdown",
      (e) => {

        if (
          playlistPanel.classList.contains("hidden")
        ) {
          return;
        }

        const target =
          e.target instanceof Element
            ? e.target
            : null;

        if (
          target &&
          (
            target.closest("#playlistPanel") ||
            target.closest("#audioPlayerBar")
          )
        ) {
          return;
        }

        setPlaylistOpen(false);

      }
    );

    // Audio tugagach — keyingisiga avtomatik o'tish
    audio.addEventListener(
      "ended",
      () => {

        if (
          !autoNext ||
          playlistIndex < 0 ||
          playlistIndex >= playlist.length - 1
        ) {
          return;
        }

        // A-B loop faol bo'lsa, undan chiqib ketmaymiz
        if (
          loopEnabled &&
          pointA !== null &&
          pointB !== null
        ) {
          return;
        }

        loadTrack(
          playlistIndex + 1,
          { autoplay: true }
        );

      }
    );

    renderPlaylist();

    /* =======================================================
       PLAY / PAUSE
    ======================================================== */

    function updatePlayIcon() {

      if (audio.paused) {

        playBtn.innerHTML =
          '<i class="fa-solid fa-play"></i>';

      } else {

        playBtn.innerHTML =
          '<i class="fa-solid fa-pause"></i>';

      }

    }


    async function togglePlay() {

      if (!hasAudioSource()) {

        showStatus(
          "Avval audio oching"
        );

        return;

      }


      if (audio.paused) {

        try {

          await audio.play();

        } catch (error) {

          console.error(
            "Audio play error:",
            error
          );

          showStatus(
            "Audio ijro etilmadi"
          );

        }

      } else {

        audio.pause();

      }


      updatePlayIcon();

    }


    playBtn.addEventListener(
      "click",
      togglePlay
    );


    /* =======================================================
       PREVIOUS / NEXT
    ======================================================== */

function previousAudio() {

      if (!hasAudioSource()) {

        showStatus(
          "Avval audio oching"
        );

        return;

      }

      // Audio boshlanganiga 3 soniyadan kam bo'lsa — oldingi audioga o'tamiz
      if (
        playlistIndex > 0 &&
        audio.currentTime <= 3
      ) {

        loadTrack(
          playlistIndex - 1,
          { autoplay: !audio.paused }
        );

        return;

      }

      audio.pause();

      audio.currentTime = 0;

      clearABLoop(
        false
      );

      updateLoopButton();

      updatePlayIcon();

      showStatus(
        "Boshiga"
      );

    }

    function nextAudio() {

      if (!hasAudioSource()) {

        showStatus(
          "Avval audio oching"
        );

        return;

      }

      if (
        playlistIndex >= 0 &&
        playlistIndex < playlist.length - 1
      ) {

        loadTrack(
          playlistIndex + 1,
          { autoplay: !audio.paused }
        );

        return;

      }

      if (playlist.length > 1) {

        showStatus(
          "Bu oxirgi audio"
        );

        return;

      }

      audio.pause();

      audio.currentTime = 0;

      clearABLoop(
        false
      );

      updateLoopButton();

      updatePlayIcon();

      showStatus(
        "Keyingi audio uchun yangi fayl oching"
      );

    }

    prevAudioBtn.addEventListener(
      "click",
      previousAudio
    );


    nextAudioBtn.addEventListener(
      "click",
      nextAudio
    );


    /* =======================================================
       AUDIO METADATA
    ======================================================== */

    audio.addEventListener(
      "loadedmetadata",
      () => {

        const total =
          getFiniteDuration();


        progress.max =
          String(total);


        progress.value =
          "0";


        duration.textContent =
          formatTime(total);


        currentTime.textContent =
          "0:00";

      }
    );


    /* =======================================================
       TIME UPDATE
    ======================================================== */

    audio.addEventListener(
      "timeupdate",
      () => {

        const total =
          getFiniteDuration();


        const current =
          Number(audio.currentTime);


        if (total > 0) {

          progress.max =
            String(total);


          progress.value =
            String(
              Math.min(
                total,
                Math.max(
                  0,
                  Number.isFinite(current)
                    ? current
                    : 0
                )
              )
            );

        }


        currentTime.textContent =
          formatTime(
            current
          );


        duration.textContent =
          formatTime(
            total
          );


        checkABLoop();

      }
    );


    /* =======================================================
       PROGRESS SEEK
    ======================================================== */

    progress.addEventListener(
      "input",
      () => {

        if (!hasAudioSource()) {
          return;
        }


        const value =
          Number(progress.value);


        if (!Number.isFinite(value)) {
          return;
        }


        const safeValue =
          clampTime(value);


        try {

          audio.currentTime =
            safeValue;

        } catch (error) {

          console.error(
            "Audio seek error:",
            error
          );

        }

      }
    );


    /* =======================================================
       AUDIO EVENTS
    ======================================================== */

    audio.addEventListener(
      "canplay",
      () => {

        updatePlayIcon();

      }
    );


    audio.addEventListener(
      "play",
      () => {

        updatePlayIcon();

      }
    );


    audio.addEventListener(
      "pause",
      () => {

        updatePlayIcon();

      }
    );


    audio.addEventListener(
      "ended",
      () => {

        updatePlayIcon();

      }
    );


    audio.addEventListener(
      "error",
      () => {

        console.error(
          "Audio element error:",
          audio.error
        );


        updatePlayIcon();


        showStatus(
          "Audio faylni o'qib bo'lmadi"
        );

      }
    );


    /* =======================================================
       A-B LOOP
    ======================================================== */

    function setPointA() {

      if (!hasAudioSource()) {

        showStatus(
          "Avval audio oching"
        );

        return;

      }


      const current =
        Number(audio.currentTime);


      const safeCurrent =
        Number.isFinite(current)
          ? Math.max(
              0,
              current
            )
          : 0;


      /*
        Avvalgi behavior saqlanadi:
        A nuqta currentTime'dan 0.2 sekund oldin olinadi.
      */

      pointA =
        Math.max(
          0,
          safeCurrent - 0.2
        );


      pointB = null;

      loopEnabled = false;

      audio.loop = false;


      btnA.classList.add(
        "active"
      );

      btnB.classList.remove(
        "active"
      );


      updateLoopButton();


      showStatus(
        "A: " +
        formatTime(pointA)
      );

    }


    function setPointB() {

      if (!hasAudioSource()) {

        showStatus(
          "Avval audio oching"
        );

        return;

      }


      if (pointA === null) {

        showStatus(
          "Avval A ni bosing"
        );

        return;

      }


      const calculatedB =
        Number(audio.currentTime);


      if (!Number.isFinite(calculatedB)) {

        showStatus(
          "B nuqtani aniqlab bo'lmadi"
        );

        return;

      }


      if (calculatedB <= pointA) {

        showStatus(
          "B A dan keyin bo'lishi kerak"
        );

        return;

      }


      pointB =
        calculatedB;


      loopEnabled = true;

      audio.loop = false;


      btnB.classList.add(
        "active"
      );


      loopBtn.classList.add(
        "active"
      );


      try {

        audio.currentTime =
          pointA;

      } catch (error) {

        console.error(
          "A-B seek error:",
          error
        );

      }


      if (audio.paused) {

        audio.play()
          .then(() => {

            updatePlayIcon();

          })
          .catch(
            (error) => {

              console.error(
                "A-B autoplay error:",
                error
              );

              updatePlayIcon();

              showStatus(
                "A-B tayyor. Play tugmasini bosing."
              );

            }
          );

      } else {

        updatePlayIcon();

      }


      showStatus(
        "A-B faol"
      );

    }


    function checkABLoop() {

      if (
        !loopEnabled ||
        pointA === null ||
        pointB === null ||
        !hasAudioSource()
      ) {

        return;

      }


      const current =
        Number(audio.currentTime);


      if (!Number.isFinite(current)) {
        return;
      }


      if (
        current >= pointB
      ) {

        try {

          audio.currentTime =
            pointA;

        } catch (error) {

          console.error(
            "A-B loop seek error:",
            error
          );

        }

      }

    }


    function clearABLoop(
      showMessage = true
    ) {

      pointA = null;

      pointB = null;

      loopEnabled = false;


      btnA.classList.remove(
        "active"
      );


      btnB.classList.remove(
        "active"
      );


      updateLoopButton();


      if (showMessage) {

        showStatus(
          "A-B loop o'chirildi"
        );

      }

    }


    btnA.addEventListener(
      "click",
      setPointA
    );


    btnB.addEventListener(
      "click",
      setPointB
    );


    clearLoopBtn.addEventListener(
      "click",
      () => {

        clearABLoop(
          true
        );

      }
    );


    /* =======================================================
       A-B LOOP — ANIQ TEKSHIRUV
       (timeupdate ~250 ms da bir marta keladi, shu sababli B nuqtadan
        sezilarli o'tib ketardi; ijro paytida har kadrda tekshiramiz)
    ======================================================== */

    let abFrameId = 0;

    function abFrameLoop() {

      abFrameId = 0;

      if (
        audio.paused ||
        audio.ended
      ) {
        return;
      }

      checkABLoop();

      abFrameId =
        requestAnimationFrame(
          abFrameLoop
        );

    }

    function startABFrameLoop() {

      if (
        !abFrameId &&
        !audio.paused
      ) {

        abFrameId =
          requestAnimationFrame(
            abFrameLoop
          );

      }

    }

    audio.addEventListener(
      "play",
      startABFrameLoop
    );

    audio.addEventListener(
      "playing",
      startABFrameLoop
    );

    /* =======================================================
       NORMAL LOOP
    ======================================================== */

    function updateLoopButton() {

      loopBtn.classList.toggle(
        "active",
        Boolean(
          loopEnabled ||
          audio.loop
        )
      );

    }


    loopBtn.addEventListener(
      "click",
      () => {

        if (!hasAudioSource()) {

          showStatus(
            "Avval audio oching"
          );

          return;

        }


        if (
          pointA !== null &&
          pointB !== null
        ) {

          loopEnabled =
            !loopEnabled;


          audio.loop = false;

        } else {

          audio.loop =
            !audio.loop;


          loopEnabled = false;

        }


        updateLoopButton();

      }
    );


    /* =======================================================
       SPEED
    ======================================================== */

    function updateSpeed() {

      const speed =
        speeds[speedIndex];


      if (
        !Number.isFinite(speed) ||
        speed <= 0
      ) {

        speedIndex =
          speeds.indexOf(1);

      }


      const safeSpeed =
        speeds[speedIndex];


      audio.playbackRate =
        safeSpeed;


      speedBtn.textContent =
        safeSpeed + "x";

    }


    speedBtn.addEventListener(
      "click",
      () => {

        speedIndex =
          (
            speedIndex + 1
          ) %
          speeds.length;


        updateSpeed();

      }
    );


    updateSpeed();


    /* =======================================================
       VOLUME
    ======================================================== */

    function updateMuteIcon(vol) {

      const safeVolume =
        Number.isFinite(
          Number(vol)
        )
          ? Number(vol)
          : 0;


      if (safeVolume <= 0) {

        muteBtn.innerHTML =
          '<i class="fa-solid fa-volume-xmark"></i>';

      } else if (safeVolume < 0.5) {

        muteBtn.innerHTML =
          '<i class="fa-solid fa-volume-low"></i>';

      } else {

        muteBtn.innerHTML =
          '<i class="fa-solid fa-volume-high"></i>';

      }

    }


    volume.addEventListener(
      "input",
      () => {

        let value =
          Number(volume.value);


        if (!Number.isFinite(value)) {
          value = 1;
        }


        value =
          Math.max(
            0,
            Math.min(
              1,
              value
            )
          );


        audio.volume =
          value;


        volume.value =
          String(value);


        if (value > 0) {

          previousVolume =
            value;

        }


        updateMuteIcon(
          value
        );

      }
    );


    muteBtn.addEventListener(
      "click",
      () => {

        if (audio.volume > 0) {

          previousVolume =
            audio.volume;


          audio.volume = 0;

          volume.value = "0";

        } else {

          const restoredVolume =
            Number.isFinite(
              Number(previousVolume)
            )
              ? Math.max(
                  0.01,
                  Math.min(
                    1,
                    Number(previousVolume)
                  )
                )
              : 1;


          audio.volume =
            restoredVolume;


          volume.value =
            String(restoredVolume);

        }


        updateMuteIcon(
          audio.volume
        );

      }
    );


    /* =======================================================
       STATUS
    ======================================================== */

    let statusTimer = null;


    function showStatus(
      text,
      durationMs = 1500
    ) {

      clearTimeout(
        statusTimer
      );


      audioStatus.textContent =
        String(text || "");


      if (
        Number.isFinite(durationMs) &&
        durationMs > 0
      ) {

        statusTimer =
          setTimeout(
            () => {

              audioStatus.textContent =
                "";

            },
            durationMs
          );

      }

    }


    /* =======================================================
       TIME FORMAT
    ======================================================== */

    function formatTime(seconds) {

      const value =
        Number(seconds);


      if (
        !Number.isFinite(value) ||
        value < 0
      ) {

        return "0:00";

      }


      const minutes =
        Math.floor(
          value / 60
        );


      const secs =
        Math.floor(
          value % 60
        );


      return (
        minutes +
        ":" +
        String(secs).padStart(
          2,
          "0"
        )
      );

    }


    /* =======================================================
       KEYBOARD SHORTCUTS
    ======================================================== */

    document.addEventListener(
      "keydown",
      (e) => {

        const target =
          e.target;


        const tag =
          target &&
          typeof target.tagName === "string"
            ? target.tagName.toUpperCase()
            : "";


        /*
          Input ichida yozayotgan paytda
          shortcutlar ishlamasin.
        */

        if (
          tag === "INPUT" ||
          tag === "SELECT" ||
          tag === "TEXTAREA" ||
          (
            target &&
            target.isContentEditable
          )
        ) {

          return;

        }


        /* ===================================================
           CTRL / CMD + O — PDF
        =================================================== */

        if (
          (e.ctrlKey || e.metaKey) &&
          e.key.toLowerCase() === "o"
        ) {

          e.preventDefault();

          openPdfBtn.click();

          return;

        }


        /* ===================================================
           SPACE — PLAY / PAUSE
        =================================================== */

        if (
          e.code === "Space"
        ) {

          e.preventDefault();

          togglePlay();

          return;

        }


        /* ===================================================
           AUDIO + PDF SHORTCUTS
        =================================================== */

        /*
          Ctrl / Cmd / Alt bilan bosilgan tugmalar brauzerga qoldiriladi
          (masalan Ctrl+0 — zoomni tiklash, Alt+← — orqaga).
        */

        if (
          e.ctrlKey ||
          e.metaKey ||
          e.altKey
        ) {
          return;
        }

        switch (e.key) {

          /* A */

          case "1":

            e.preventDefault();

            setPointA();

            break;


          /* B */

          case "3":

            e.preventDefault();

            setPointB();

            break;


          /* CLEAR A-B */

          case "7":

            e.preventDefault();

            clearABLoop(true);

            break;


          /* PLAY */

          case "5":

            e.preventDefault();

            togglePlay();

            break;


          /* -2 seconds */

          case "4":

            e.preventDefault();


            if (hasAudioSource()) {

              const current =
                Number(audio.currentTime);


              const nextTime =
                Number.isFinite(current)
                  ? Math.max(
                      0,
                      current - 2
                    )
                  : 0;


              try {

                audio.currentTime =
                  clampTime(nextTime);

              } catch (error) {

                console.error(
                  "Audio seek error:",
                  error
                );

              }


              showStatus(
                "-2s"
              );

            }

            break;


          /* +2 seconds */

          case "6":

            e.preventDefault();


            if (hasAudioSource()) {

              const current =
                Number(audio.currentTime);


              const safeCurrent =
                Number.isFinite(current)
                  ? current
                  : 0;


              const total =
                getFiniteDuration();


              const requested =
                safeCurrent + 2;


              const nextTime =
                total > 0
                  ? Math.min(
                      total,
                      requested
                    )
                  : Math.max(
                      0,
                      requested
                    );


              try {

                audio.currentTime =
                  clampTime(nextTime);

              } catch (error) {

                console.error(
                  "Audio seek error:",
                  error
                );

              }


              showStatus(
                "+2s"
              );

            }

            break;


          /* START */

          case "0":

            e.preventDefault();


            if (hasAudioSource()) {

              try {

                audio.currentTime = 0;

              } catch (error) {

                console.error(
                  "Audio seek error:",
                  error
                );

              }


              showStatus(
                "Boshiga"
              );

            }

            break;


          /* VOLUME DOWN */

          case "2":

            e.preventDefault();


            audio.volume =
              Math.max(
                0,
                audio.volume - 0.1
              );


            volume.value =
              String(audio.volume);


            if (audio.volume > 0) {

              previousVolume =
                audio.volume;

            }


            updateMuteIcon(
              audio.volume
            );

            break;


          /* VOLUME UP */

          case "8":

            e.preventDefault();


            audio.volume =
              Math.min(
                1,
                audio.volume + 0.1
              );


            volume.value =
              String(audio.volume);


            if (audio.volume > 0) {

              previousVolume =
                audio.volume;

            }


            updateMuteIcon(
              audio.volume
            );

            break;


          /* LOOP */

          case "9":

            e.preventDefault();

            loopBtn.click();

            break;


          /* PLAYLIST: KEYINGI / OLDINGI AUDIO, RO'YXAT */

          case "n":
          case "N":

            if (!e.ctrlKey && !e.metaKey && !e.altKey) {

              e.preventDefault();

              nextAudio();

            }

            break;

          case "p":
          case "P":

            if (!e.ctrlKey && !e.metaKey && !e.altKey) {

              e.preventDefault();

              previousAudio();

            }

            break;

          case "l":
          case "L":

            if (!e.ctrlKey && !e.metaKey && !e.altKey) {

              e.preventDefault();

              setPlaylistOpen(
                playlistPanel.classList.contains("hidden")
              );

            }

            break;

          case "Escape":

            if (!playlistPanel.classList.contains("hidden")) {

              e.preventDefault();

              setPlaylistOpen(false);

            }

            break;

          /* MUTE */

          case "m":
          case "M":

            e.preventDefault();

            muteBtn.click();

            break;


          /* RESET SPEED */

          case "/":

            e.preventDefault();


            speedIndex =
              speeds.indexOf(1);


            updateSpeed();

            break;


          /* NEXT SPEED */

          case "*":

            e.preventDefault();


            speedIndex =
              (
                speedIndex + 1
              ) %
              speeds.length;


            updateSpeed();

            break;


          /* =================================================
             PDF PAGE NAVIGATION
          ================================================= */

          case "ArrowLeft":

            if (pdfDoc) {

              e.preventDefault();

              goToPage(
                pageNum - 1
              );

            }

            break;


          case "ArrowRight":

            if (pdfDoc) {

              e.preventDefault();

              goToPage(
                pageNum + 1
              );

            }

            break;
          
          case "ArrowUp":

  if (pdfDoc) {

    e.preventDefault();

    navLock = false;

    pdfContainer.scrollBy({
      top: -100,
      left: 0,
      behavior: "smooth"
    });

  }

  break;


case "ArrowDown":

  if (pdfDoc) {

    e.preventDefault();

    navLock = false;

    pdfContainer.scrollBy({
      top: 100,
      left: 0,
      behavior: "smooth"
    });

  }

  break;


          case "Home":

            if (pdfDoc) {

              e.preventDefault();

              goToPage(1);

            }

            break;


          case "End":

            if (pdfDoc) {

              e.preventDefault();

              goToPage(
                pdfDoc.numPages
              );

            }

            break;


          /* =================================================
             PDF ZOOM
          ================================================= */

          case "+":

          case "=":

            if (
              !e.ctrlKey &&
              !e.metaKey
            ) {

              e.preventDefault();

              changeZoom(
                ZOOM_STEP
              );

            }

            break;


          case "-":

          case "_":

            if (
              !e.ctrlKey &&
              !e.metaKey
            ) {

              e.preventDefault();

              changeZoom(
                -ZOOM_STEP
              );

            }

            break;

        }

      }
    );


    /* =======================================================
       SPACE (keyup) — fokusdagi tugma qo'shimcha "click" bermasin
    ======================================================== */

    document.addEventListener(
      "keyup",
      (e) => {

        if (e.code !== "Space") {
          return;
        }

        const target =
          e.target;

        const tag =
          target &&
          typeof target.tagName === "string"
            ? target.tagName.toUpperCase()
            : "";

        if (
          tag === "INPUT" ||
          tag === "SELECT" ||
          tag === "TEXTAREA" ||
          (
            target &&
            target.isContentEditable
          )
        ) {
          return;
        }

        e.preventDefault();

      }
    );

    /* =======================================================
       CLEANUP
    ======================================================== */

    window.addEventListener(
      "beforeunload",
      () => {

        clearTimeout(
          statusTimer
        );


        if (audioFileURL) {

          URL.revokeObjectURL(
            audioFileURL
          );

          audioFileURL = null;

        }


        if (
          pdfDoc &&
          typeof pdfDoc.destroy === "function"
        ) {

          try {

            pdfDoc.destroy();

          } catch (error) {

            console.error(
              "PDF cleanup error:",
              error
            );

          }

        }

      }
    );


    /* =======================================================
       INITIAL STATE
    ======================================================== */

    updatePdfButtons();

    updatePlayIcon();

    updateMuteIcon(
      audio.volume
    );

    updateLoopButton();

    updateSpeed();

  </script>
